<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Spherical Bent 3D Text</title>
<style>
  body {
    margin: 0;
    overflow: hidden;
    background: #2f5260;
  }

  canvas {
    display: block;
  }
</style>

<script async src="https://unpkg.com/es-module-shims@1.10.0/dist/es-module-shims.js"></script>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>

<body>
<script type="module">
import * as THREE from "three";
import { FontLoader } from "three/addons/loaders/FontLoader.js";
import { TextGeometry } from "three/addons/geometries/TextGeometry.js";

const scene = new THREE.Scene();
scene.background = new THREE.Color("#2f5260");

const camera = new THREE.PerspectiveCamera(35, innerWidth / innerHeight, 0.1, 1000);
camera.position.set(0, 0, 68);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(window.devicePixelRatio);
document.body.appendChild(renderer.domElement);

const group = new THREE.Group();
scene.add(group);

scene.add(new THREE.AmbientLight(0xffffff, 1.35));

const keyLight = new THREE.DirectionalLight(0xffffff, 2.4);
keyLight.position.set(8, 12, 22);
scene.add(keyLight);

const redLight = new THREE.PointLight(0xff5a3d, 9, 90);
redLight.position.set(0, -2, 20);
scene.add(redLight);

function sphereBendGeometry(geometry, strength = 0.058, radius = 19) {
  const pos = geometry.attributes.position;

  for (let i = 0; i < pos.count; i++) {
    const x = pos.getX(i);
    const y = pos.getY(i);
    const z = pos.getZ(i);

    const theta = x * strength;
    const phi = y * strength * 0.55;

    const newX = radius * Math.sin(theta) * Math.cos(phi);
    const newY = radius * Math.sin(phi);
    const newZ = radius * Math.cos(theta) * Math.cos(phi) - radius;

    pos.setXYZ(i, newX, newY, newZ + z * 1.8);
  }

  pos.needsUpdate = true;
  geometry.computeVertexNormals();
  geometry.computeBoundingBox();
  geometry.computeBoundingSphere();
}

const loader = new FontLoader();

loader.load("https://threejs.org/examples/fonts/helvetiker_bold.typeface.json", font => {
  const textGeo = new TextGeometry("THEM", {
    font,
    size: 12,
    height: 13,
    curveSegments: 18,
    bevelEnabled: true,
    bevelThickness: 0.35,
    bevelSize: 0.22,
    bevelSegments: 3
  });

  textGeo.center();
  sphereBendGeometry(textGeo, 0.058, 19);

  const frontMat = new THREE.MeshStandardMaterial({
    color: "#211f20",
    roughness: 0.55,
    metalness: 0.05
  });

  const sideMat = new THREE.MeshStandardMaterial({
    color: "#ff6847",
    roughness: 0.35,
    metalness: 0.08,
    emissive: "#64160d",
    emissiveIntensity: 0.45
  });

  const textMesh = new THREE.Mesh(textGeo, [frontMat, sideMat]);
  group.add(textMesh);

  const glowGeo = new THREE.SphereGeometry(13, 48, 24);
  const glowMat = new THREE.MeshBasicMaterial({
    color: "#ffd2c0",
    transparent: true,
    opacity: 0.42
  });

  const glow = new THREE.Mesh(glowGeo, glowMat);
  glow.scale.set(1.45, 0.82, 0.2);
  glow.position.set(0, 0, -12);
  group.add(glow);
});

function animate() {
  requestAnimationFrame(animate);
  group.rotation.y = Math.sin(performance.now() * 0.0007) * 0.1;
  group.rotation.x = -0.08;
  renderer.render(scene, camera);
}

animate();

window.addEventListener("resize", () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
