<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Wes Wilson Style - Reverted Egg</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #98806b;
      --paper: #ffffff;
      --yellow: #ffe500;
      --red: #ff3a00;
      --pink: #ff72fd;
      --blue: #0055fe;
      --purpleBright: #B301FF;
      --green: #0f7a3b;
      --black: #000000;
      --ui-bg: rgba(0,0,0,0.80);
      --ui-border: rgba(255,255,255,0.14);
      --ui-label: var(--pink);
      --ui-accent: var(--red);
    }

    html,
    body {
      margin: 0;
      padding: 0;
      height: 100%;
      width: 100%;
      overflow: hidden;
      background: var(--bg);
    }

    canvas {
      display: block;
      width: 100vw;
      height: 100vh;
      position: fixed;
      inset: 0;
    }

    .ui {
      position: fixed;
      left: 16px;
      top: 16px;
      background: var(--ui-bg);
      color: #fff;
      padding: 15px;
      border-radius: 10px;
      font: 11px "Bricolage Grotesque", sans-serif;
      backdrop-filter: blur(8px);
      width: 280px;
      border: 1px solid var(--ui-border);
      z-index: 10;
    }

    .row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin: 10px 0;
      gap: 12px;
    }

    .label-group {
      display: flex;
      flex-direction: column;
      width: 100px;
    }

    input[type=range] {
      width: 150px;
      accent-color: var(--ui-accent);
      cursor: pointer;
    }

    label {
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--ui-label);
      font-weight: 800;
    }

    .val {
      color: #fff;
      font-size: 10px;
      margin-top: 2px;
      opacity: 0.85;
    }

    .hint {
      margin: 10px 0 0 0;
      color: rgba(255,255,255,0.55);
      font-size: 9px;
      letter-spacing: 1px;
    }
  </style>
</head>
<body>
  <div class="ui">
    <div class="row">
      <div class="label-group"><label>Bulge Warp</label><span class="val" id="v_warp">1.35</span></div>
      <input id="warp" type="range" min="0.1" max="3.0" step="0.05" value="1.35">
    </div>
    <div class="row">
      <div class="label-group"><label>Tallness</label><span class="val" id="v_tall">3.20</span></div>
      <input id="tall" type="range" min="1.0" max="6.0" step="0.1" value="3.20">
    </div>
    <div class="row">
      <div class="label-group"><label>Scan Pinch</label><span class="val" id="v_scanPinch">1.80</span></div>
      <input id="scanPinch" type="range" min="0" max="5.0" step="0.1" value="1.80">
    </div>
    <p class="hint">TAN BG + PAPER / YELLOW / RED / PINK / BRIGHT PURPLE / GREEN</p>
  </div>

<script type="module">
import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js";

const COL = {
  bg: "#98806b",
  paper: "#ffffff",
  yellow: "#ffe500",
  red: "#ff3a00",
  pink: "#ff72fd",
  purple: "#B301FF",
  green: "#0f7a3b",
  black: "#000000"
};

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(2.5, window.devicePixelRatio));
document.body.appendChild(renderer.domElement);

const texCanvas = document.createElement("canvas");
texCanvas.width = 4096;
texCanvas.height = 2048;
const ctx = texCanvas.getContext("2d", { alpha: false });

function drawText() {
  const W = texCanvas.width;
  const H = texCanvas.height;
  ctx.fillStyle = COL.bg;
  ctx.fillRect(0, 0, W, H);
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";

  const words = [
    "JEFFERSON",
    "AIRPLANE",
    "GREAT SOCIETY",
    "HEAVENLY",
    "BLUES BAND",
    "JUNE 10 11",
    "FILLMORE"
  ];

  const colors = [COL.paper, COL.yellow, COL.red, COL.pink, COL.purple, COL.green];
  const cols = 4;
  const tileW = W / cols;
  ctx.font = "800 360px 'Bricolage Grotesque'";

  for (let i = 0; i < cols; i++) {
    const cx = (i + 0.5) * tileW;
    words.forEach((word, j) => {
      const cy = 220 + j * 280;
      ctx.save();
      ctx.fillStyle = colors[j % colors.length];
      ctx.translate(cx, cy);
      ctx.scale(Math.min(1.2, (tileW - 40) / ctx.measureText(word).width), 1.1);
      ctx.fillText(word, 0, 0);
      ctx.restore();
    });
  }
}

const textTex = new THREE.CanvasTexture(texCanvas);
textTex.colorSpace = THREE.SRGBColorSpace;
textTex.wrapS = textTex.wrapT = THREE.RepeatWrapping;

document.fonts.ready.then(() => {
  drawText();
  textTex.needsUpdate = true;
});

const scene = new THREE.Scene();
const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);

const material = new THREE.ShaderMaterial({
  uniforms: {
    u_tex: { value: textTex },
    u_time: { value: 0 },
    u_speed: { value: 0.13 },
    u_warp: { value: 1.35 },
    u_tall: { value: 3.2 },
    u_scale: { value: 0.36 },
    u_rotateX: { value: 0.03 },
    u_bg: { value: new THREE.Color(COL.bg) },
    u_waveAmp: { value: 0.08 },
    u_waveFreq: { value: 3.5 },
    u_slitInside: { value: 0.995 },
    u_slitInWidth: { value: 0.15 },
    u_scanPinch: { value: 1.8 }
  },
  vertexShader: `
    varying vec2 vUv;
    void main() { vUv = uv; gl_Position = vec4(position.xy, 0.0, 1.0); }
  `,
  fragmentShader: `
    varying vec2 vUv;
    uniform sampler2D u_tex;
    uniform float u_time, u_speed, u_warp, u_tall, u_scale, u_rotateX, u_waveAmp, u_waveFreq, u_scanPinch;
    uniform vec3 u_bg;
    uniform float u_slitInside, u_slitInWidth;

    float tightenY(float y) {
      float t = y - 0.5;
      float a = clamp(abs(t) * 2.0, 0.0, 1.0);
      return 0.5 + t * (1.0 - 0.16 * pow(a, 2.2));
    }

    void main() {
      vec2 p = (vUv - 0.5) * 2.0 / u_scale;
      p.x -= p.y * u_rotateX;

      float radius = 0.5;
      float r2 = (p.x * p.x) + (p.y * p.y) / (u_tall * u_tall);
      float edgeX = sqrt(max(0.0, radius - (p.y * p.y) / (u_tall * u_tall)));
      float aa = fwidth(r2) * 1.5;
      float insideMask = smoothstep(radius + aa, radius - aa, r2);

      float z = sqrt(max(0.0, 1.0 - r2 * u_warp));
      vec2 bulgeP = p / (z + 0.5);

      float maxY = u_tall * sqrt(radius);
      float yn = clamp(abs(p.y) / maxY, 0.0, 1.0);
      float comp = mix(1.0, 0.72, pow(yn, 1.8));
      bulgeP.y *= comp;

      float wave = sin((bulgeP.x * u_waveFreq) + (u_time * 2.0)) * u_waveAmp;
      vec2 eggUv = bulgeP * 0.3 + 0.5;
      eggUv.y += wave;
      eggUv.x += u_time * u_speed;
      eggUv.y = tightenY(eggUv.y);

      float insideX = edgeX * u_slitInside;
      float sx = (p.x >= 0.0) ? insideX : -insideX;
      float edgeR2 = (sx * sx) + (p.y * p.y) / (u_tall * u_tall);
      float edgeZ = sqrt(max(0.0, 1.0 - edgeR2 * u_warp));
      vec2 slitP = vec2(sx, p.y) / (edgeZ + 0.5);
      slitP.y *= comp;

      float outsideDist = max(0.0, abs(p.x) - edgeX);
      float pinchFactor = 1.0 + outsideDist * u_scanPinch;

      vec2 slitUv = slitP * 0.3 + 0.5;
      slitUv.y = (slitUv.y - 0.5) * pinchFactor + 0.5;

      float slitWave = sin((slitP.x * u_waveFreq) + (u_time * 2.0)) * u_waveAmp;
      slitUv.y += slitWave;
      slitUv.x += u_time * u_speed;
      slitUv.y = tightenY(slitUv.y);

      vec3 sliceCol = texture2D(u_tex, slitUv).rgb;

      float distToEdge = edgeX - abs(p.x);
      float edgeProx = 1.0 - clamp(distToEdge / max(1e-5, u_slitInWidth), 0.0, 1.0);
      float slitInset = pow(edgeProx, 2.8);
      vec3 finalEggCol = texture2D(u_tex, mix(eggUv, slitUv, slitInset)).rgb;

      float outside = max(0.0, abs(p.x) - edgeX);
      float verticalBounds = smoothstep(maxY + 0.05, maxY - 0.05, abs(p.y) * pinchFactor);
      float fade = verticalBounds / (1.0 + outside * 8.0);

      vec3 backgroundWithStreaks = mix(u_bg, sliceCol, fade);
      vec3 finalCol = mix(backgroundWithStreaks, finalEggCol, insideMask);

      gl_FragColor = vec4(finalCol, 1.0);
    }
  `
});

scene.add(new THREE.Mesh(new THREE.PlaneGeometry(2, 2), material));

const binds = [["warp", "u_warp"], ["tall", "u_tall"], ["scanPinch", "u_scanPinch"]];
binds.forEach(([id, uniform]) => {
  const el = document.getElementById(id);
  el.addEventListener("input", () => {
    document.getElementById("v_" + id).textContent = (+el.value).toFixed(2);
    material.uniforms[uniform].value = parseFloat(el.value);
  });
});

function animate(t) {
  const time = t * 0.001;
  material.uniforms.u_time.value = time;
  material.uniforms.u_rotateX.value = Math.sin(time * 0.4) * 0.1;
  renderer.render(scene, camera);
  requestAnimationFrame(animate);
}
requestAnimationFrame(animate);

window.addEventListener("resize", () => {
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
</html>
