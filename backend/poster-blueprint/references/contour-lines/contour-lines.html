<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Templates - Bricolage Sharp</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,200..800&display=swap"
      rel="stylesheet"
    />

    <style>
      html,
      body {
        margin: 0;
        background: #000;
        height: 100%;
        width: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        font-family: "Bricolage Grotesque", sans-serif;
      }

      #container {
        position: relative;
        width: 80vh;
        aspect-ratio: 4 / 5;
        background: #000;
      }

      canvas {
        display: block;
        width: 100%;
        height: 100%;
        image-rendering: -webkit-optimize-contrast;
      }

      .font-loader {
        position: absolute;
        opacity: 0;
        pointer-events: none;
        font-weight: 800;
      }
    </style>
  </head>
  <body>
    <div class="font-loader">Force Load Bricolage</div>

    <div id="container">
      <canvas id="c"></canvas>
    </div>

    <script>
      const canvas = document.getElementById("c");
      const ctx = canvas.getContext("2d", { willReadFrequently: true });

      const palette = [
        { r: 247, g: 104, b: 51 },
        { r: 12, g: 12, b: 12 },
        { r: 76, g: 101, b: 240 },
        { r: 12, g: 12, b: 12 },
        { r: 255, g: 250, b: 235 },
        { r: 12, g: 12, b: 12 },
        { r: 255, g: 198, b: 11 },
        { r: 12, g: 12, b: 12 },
        { r: 38, g: 97, b: 65 },
        { r: 12, g: 12, b: 12 },
      ];

      const bandWidth = 8;
      const flowSpeed = 28;

      let W;
      let H;
      let DPR;
      let dist2 = null;
      let insideMask = null;

      const textCanvas = document.createElement("canvas");
      const tctx = textCanvas.getContext("2d", { willReadFrequently: true });

      function edt1d(f, n) {
        const v = new Int32Array(n);
        const z = new Float32Array(n + 1);
        const d = new Float32Array(n);
        let k = 0;
        v[0] = 0;
        z[0] = -Infinity;
        z[1] = Infinity;

        for (let q = 1; q < n; q++) {
          let s;
          while (true) {
            const vk = v[k];
            s = (f[q] + q * q - (f[vk] + vk * vk)) / (2 * q - 2 * vk);
            if (s > z[k]) break;
            k--;
            if (k < 0) {
              k = 0;
              break;
            }
          }
          k++;
          v[k] = q;
          z[k] = s;
          z[k + 1] = Infinity;
        }

        k = 0;
        for (let q = 0; q < n; q++) {
          while (z[k + 1] < q) k++;
          const vk = v[k];
          const dx = q - vk;
          d[q] = dx * dx + f[vk];
        }
        return d;
      }

      function edt2d(mask, w, h) {
        const INF = 1e20;
        const rowBuf = new Float32Array(w);
        const tmp = new Float32Array(w * h);

        for (let y = 0; y < h; y++) {
          const base = y * w;
          for (let x = 0; x < w; x++) rowBuf[x] = mask[base + x] ? 0 : INF;
          const dRow = edt1d(rowBuf, w);
          for (let x = 0; x < w; x++) tmp[base + x] = dRow[x];
        }

        const colBuf = new Float32Array(h);
        const out = new Float32Array(w * h);
        for (let x = 0; x < w; x++) {
          for (let y = 0; y < h; y++) colBuf[y] = tmp[x + y * w];
          const dCol = edt1d(colBuf, h);
          for (let y = 0; y < h; y++) out[x + y * w] = dCol[y];
        }
        return out;
      }

      function resize() {
        DPR = window.devicePixelRatio || 1;
        const rect = canvas.getBoundingClientRect();
        W = Math.floor(rect.width * DPR);
        H = Math.floor(rect.height * DPR);
        canvas.width = textCanvas.width = W;
        canvas.height = textCanvas.height = H;
        buildDistanceField();
      }

      function drawTextTracked(ctx2, text, x, y, trackingPx, align = "center") {
        const chars = [...text];
        const widths = chars.map((ch) => ctx2.measureText(ch).width);
        const total =
          widths.reduce((a, b) => a + b, 0) +
          trackingPx * Math.max(0, chars.length - 1);

        let startX = x;
        if (align === "center") startX = x - total / 2;
        if (align === "right") startX = x - total;

        let cx = startX;
        for (let i = 0; i < chars.length; i++) {
          ctx2.fillText(chars[i], cx, y);
          cx += widths[i] + trackingPx;
        }
      }

      function buildDistanceField() {
        tctx.setTransform(1, 0, 0, 1, 0, 0);
        tctx.clearRect(0, 0, W, H);
        tctx.fillStyle = "white";
        tctx.textBaseline = "middle";

        const family = "'Bricolage Grotesque'";
        const fontSize = W * 0.17;
        tctx.font = `800 ${fontSize}px ${family}, sans-serif`;
        drawTextTracked(tctx, "Templates", W / 2, H / 2 - fontSize * 0.1, -3 * DPR);

        const subSize = fontSize * 0.38;
        tctx.font = `800 ${subSize}px ${family}, sans-serif`;
        drawTextTracked(tctx, "OUT NOW", W / 2, H / 2 + fontSize * 0.45, -1.5 * DPR);

        const cornerSize = fontSize * 0.18;
        tctx.font = `800 ${cornerSize}px ${family}, sans-serif`;
        const px = W * 0.08;
        const py = H * 0.08;

        tctx.textAlign = "left";
        tctx.fillText("VOL. 01", px, py);
        tctx.textAlign = "right";
        tctx.fillText("2026", W - px, py);
        tctx.textAlign = "left";
        tctx.fillText("SYSTEM", px, H - py);
        tctx.textAlign = "right";
        tctx.fillText("ASSETS", W - px, H - py);

        const img = tctx.getImageData(0, 0, W, H);
        insideMask = new Uint8Array(W * H);
        for (let i = 0; i < W * H; i++) {
          insideMask[i] = img.data[i * 4 + 3] > 128 ? 1 : 0;
        }
        dist2 = edt2d(insideMask, W, H);
      }

      function render(tSec) {
        if (!dist2) return;
        const out = ctx.createImageData(W, H);
        const op = out.data;
        const offset = tSec * flowSpeed * DPR;

        for (let i = 0; i < W * H; i++) {
          const pi = i * 4;
          if (insideMask[i]) {
            op[pi] = 255;
            op[pi + 1] = 255;
            op[pi + 2] = 255;
            op[pi + 3] = 255;
            continue;
          }

          const d = Math.sqrt(dist2[i]);
          const phase = (d - offset) / (bandWidth * DPR);
          const idx = Math.floor(Math.abs(phase)) % palette.length;
          const c = palette[idx];
          op[pi] = c.r;
          op[pi + 1] = c.g;
          op[pi + 2] = c.b;
          op[pi + 3] = 255;
        }
        ctx.putImageData(out, 0, 0);
      }

      function frame(now) {
        render(now * 0.001);
        requestAnimationFrame(frame);
      }

      async function init() {
        try {
          await document.fonts.load("800 10px 'Bricolage Grotesque'");
          await document.fonts.ready;
        } catch (error) {
          console.error("Font loading failed, falling back", error);
        }

        resize();
        requestAnimationFrame(frame);
      }

      window.addEventListener("resize", resize);
      init();
    </script>
  </body>
</html>
