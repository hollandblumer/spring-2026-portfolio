services:
  - type: web
    name: poster-blueprint-api
    env: python
    plan: free
    rootDir: backend/poster-blueprint
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: poster-blueprint-db
          property: connectionString
      - key: ALLOWED_ORIGINS
        value: https://hollandblumer.com,https://www.hollandblumer.com,https://hollandblumer.github.io

databases:
  - name: poster-blueprint-db
    plan: free
    databaseName: poster_blueprint
    user: poster_blueprint_user
