services:
  - type: web
    name: poster-blueprint-api
    env: python
    rootDir: backend/poster-blueprint
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: ALLOWED_ORIGINS
        value: https://hollandblumer.com,https://www.hollandblumer.com,https://hollandblumer.github.io
  - type: web
    name: 3d-motion-marbling-api
    env: python
    rootDir: backend/3d-motion-marbling
    buildCommand: pip install wheel setuptools && pip install --no-build-isolation -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: ALLOWED_ORIGINS
        value: https://hollandblumer.com,https://www.hollandblumer.com,https://hollandblumer.github.io
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: GOOGLE_APPLICATION_CREDENTIALS
        value: /etc/secrets/gcp-service-account.json
      - key: GCP_SERVICE_ACCOUNT_JSON
        sync: false
      - key: GCS_MANO_BUCKET
        sync: false
      - key: MANO_MODEL_DIR
        value: /tmp/mano-models
      - key: MANO_ITERATIONS
        value: 5
      - key: MANO_MAX_FITTERS
        value: 2
      - key: MANO_TORCH_THREADS
        value: 1
      - key: MPLCONFIGDIR
        value: /tmp/matplotlib
      - key: MANO_UPLOAD_TOKEN
        sync: false
