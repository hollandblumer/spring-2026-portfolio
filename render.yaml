services:
  - type: web
    name: poster-blueprint-api
    env: python
    rootDir: backend/poster-blueprint
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: ALLOWED_ORIGINS
        value: https://hollandblumer.com,https://www.hollandblumer.com,https://hollandblumer.github.io
