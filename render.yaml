services:
  - type: web
    name: poster-blueprint-api
    env: python
    rootDir: backend/poster-blueprint
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: ALLOWED_ORIGINS
        value: https://hollandblumer.com,https://www.hollandblumer.com,https://hollandblumer.github.io
  - type: web
    name: 3d-motion-marbling-api
    env: python
    rootDir: backend/3d-motion-marbling
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: ALLOWED_ORIGINS
        value: https://hollandblumer.com,https://www.hollandblumer.com,https://hollandblumer.github.io
      - key: GOOGLE_APPLICATION_CREDENTIALS
        value: /etc/secrets/gcp-service-account.json
      - key: GCS_MANO_BUCKET
        sync: false
      - key: MANO_MODEL_DIR
        value: /tmp/mano-models
      - key: MANO_UPLOAD_TOKEN
        sync: false
