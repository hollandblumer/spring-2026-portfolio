<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1500" role="img" aria-labelledby="title desc">
  <title id="title">3D Motion Marbling preview</title>
  <desc id="desc">A colorful marbling bath with an orange wireframe hand moving across it.</desc>
  <defs>
    <radialGradient id="bathA" cx="24%" cy="22%" r="48%">
      <stop offset="0" stop-color="#fff7df"/>
      <stop offset=".44" stop-color="#ffd93b"/>
      <stop offset=".72" stop-color="#ff6f00"/>
      <stop offset="1" stop-color="#ff6f00" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="bathB" cx="72%" cy="26%" r="42%">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset=".5" stop-color="#009688"/>
      <stop offset="1" stop-color="#009688" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="bathC" cx="52%" cy="62%" r="58%">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset=".36" stop-color="#e91e63"/>
      <stop offset=".7" stop-color="#2150b4"/>
      <stop offset="1" stop-color="#2150b4" stop-opacity="0"/>
    </radialGradient>
    <filter id="soften">
      <feGaussianBlur stdDeviation="18"/>
      <feColorMatrix type="saturate" values="1.2"/>
    </filter>
    <filter id="glow">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="1200" height="1500" fill="#f4ecd2"/>
  <g filter="url(#soften)" opacity=".95">
