<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Loading — Pulled Edges Into Two Piles</title>
  <style>
    *{box-sizing:border-box}
    html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#000}
    canvas{position:fixed;inset:0;display:block;width:100%;height:100%;animation:field-out 5s both}
    .piles{position:fixed;inset:0;pointer-events:none}
    .pile{position:absolute;top:68%;width:min(21vw,230px);aspect-ratio:1.42;transform:translate(-50%,-50%) scaleY(.05);opacity:0;animation:pile-in .9s cubic-bezier(.2,.8,.2,1) 3.65s forwards}
    .pile:nth-child(1){left:36%;--a:#fe5001;--b:#ffe500}
    .pile:nth-child(2){left:64%;--a:#ff72fd;--b:#536c00}
    .pile i,.pile b{position:absolute;inset:0;border-radius:7px}
    .pile i{background:#55534f;border:1px solid #777;box-shadow:0 -4px 0 #4a4946,0 -8px 0 #5c5a56,0 -12px 0 #454441,0 -16px 0 #66635e,0 -20px 0 #4c4b48}
    .pile b{background:linear-gradient(135deg,var(--a),var(--b));transform:translateY(-24px)}
    @keyframes field-out{0%,68%{opacity:1}92%,100%{opacity:0}}
    @keyframes pile-in{0%{opacity:0;transform:translate(-50%,-50%) scaleX(.75) scaleY(.05)}100%{opacity:1;transform:translate(-50%,-50%) scale(1)}}
    @media(max-width:760px){
      .pile:nth-child(1){left:25%}
      .pile:nth-child(2){left:75%}
    }
  </style>
</head>
<body>
  <div class="piles" aria-hidden="true">
    <div class="pile"><i></i><b></b></div>
    <div class="pile"><i></i><b></b></div>
  </div>
  <script type="module">
    import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js";

    const COLORS=["#fe5001","#ffe500","#ff72fd","#536c00"];
    const renderer=new THREE.WebGLRenderer({antialias:true,alpha:false});
    renderer.setSize(innerWidth,innerHeight);
    renderer.setPixelRatio(Math.min(2,devicePixelRatio||1));
    renderer.setClearColor(0x000000,1);
    document.body.prepend(renderer.domElement);

    const texCanvas=document.createElement("canvas");
    texCanvas.width=4096;
    texCanvas.height=2048;
    const ctx=texCanvas.getContext("2d",{alpha:false});

    function drawText(){
      const W=texCanvas.width,H=texCanvas.height;
      ctx.fillStyle="#000";
      ctx.fillRect(0,0,W,H);
      ctx.textAlign="center";
      ctx.textBaseline="middle";
      ctx.font='900 780px "Arial Black",Impact,sans-serif';
      const ink=ctx.createLinearGradient(W*.18,0,W*.82,0);
      COLORS.forEach((color,index)=>ink.addColorStop(index/(COLORS.length-1),color));
      ctx.fillStyle=ink;
      ctx.fillText("LOADING",W/2,H/2,W*.76);
    }
    drawText();

    const texture=new THREE.CanvasTexture(texCanvas);
    texture.colorSpace=THREE.SRGBColorSpace;
    texture.wrapS=texture.wrapT=THREE.ClampToEdgeWrapping;
    texture.needsUpdate=true;

    const uniforms={
      u_tex:{value:texture},
      u_time:{value:0},
      u_speed:{value:0},
      u_warp:{value:1.35},
      u_tall:{value:3.2},
      u_scale:{value:.36},
      u_rotateX:{value:.03},
      u_bg:{value:new THREE.Color("#000")},
      u_waveAmp:{value:.08},
      u_waveFreq:{value:3.5},
      u_slitInside:{value:.995},
      u_slitInWidth:{value:.15},
      u_scanPinch:{value:1.8}
    };

    const material=new THREE.ShaderMaterial({
      uniforms,
      vertexShader:`
        varying vec2 vUv;
        void main(){vUv=uv;gl_Position=vec4(position.xy,0.,1.);}
      `,
      fragmentShader:`
        precision highp float;
        varying vec2 vUv;
        uniform sampler2D u_tex;
        uniform float u_time,u_speed,u_warp,u_tall,u_scale,u_rotateX,u_waveAmp,u_waveFreq,u_scanPinch;
        uniform vec3 u_bg;
        uniform float u_slitInside,u_slitInWidth;

        float tightenY(float y){
          float t=y-.5;
          float a=clamp(abs(t)*2.,0.,1.);
          return .5+t*(1.-.16*pow(a,2.2));
        }

        void main(){
          vec2 p=(vUv-.5)*2./u_scale;
          p.x-=p.y*u_rotateX;

          float radius=.5;
          float r2=p.x*p.x+(p.y*p.y)/(u_tall*u_tall);
          float edgeX=sqrt(max(0.,radius-(p.y*p.y)/(u_tall*u_tall)));
          float aa=fwidth(r2)*1.5;
          float insideMask=smoothstep(radius+aa,radius-aa,r2);

          float z=sqrt(max(0.,1.-r2*u_warp));
          vec2 bulgeP=p/(z+.5);
          float maxY=u_tall*sqrt(radius);
          float yn=clamp(abs(p.y)/maxY,0.,1.);
          float comp=mix(1.,.72,pow(yn,1.8));
          bulgeP.y*=comp;

          float wave=sin(bulgeP.x*u_waveFreq+u_time*2.)*u_waveAmp;
          vec2 eggUv=bulgeP*.3+.5;
          eggUv.y+=wave;
          eggUv.x+=u_time*u_speed;
          eggUv.y=tightenY(eggUv.y);

          float insideX=edgeX*u_slitInside;
          float sx=p.x>=0.?insideX:-insideX;
          float edgeR2=sx*sx+(p.y*p.y)/(u_tall*u_tall);
          float edgeZ=sqrt(max(0.,1.-edgeR2*u_warp));
          vec2 slitP=vec2(sx,p.y)/(edgeZ+.5);
          slitP.y*=comp;

          float outsideDist=max(0.,abs(p.x)-edgeX);
          float pinchFactor=1.+outsideDist*u_scanPinch;
          vec2 slitUv=slitP*.3+.5;
          slitUv.y=(slitUv.y-.5)*pinchFactor+.5;
          slitUv.y+=sin(slitP.x*u_waveFreq+u_time*2.)*u_waveAmp;
          slitUv.x+=u_time*u_speed;
          slitUv.y=tightenY(slitUv.y);

          vec3 sliceCol=texture2D(u_tex,slitUv).rgb;
          float distToEdge=edgeX-abs(p.x);
          float edgeProx=1.-clamp(distToEdge/max(.00001,u_slitInWidth),0.,1.);
          float slitInset=pow(edgeProx,2.8);
          vec3 eggCol=texture2D(u_tex,mix(eggUv,slitUv,slitInset)).rgb;

          float outside=max(0.,abs(p.x)-edgeX);
          float verticalBounds=smoothstep(maxY+.05,maxY-.05,abs(p.y)*pinchFactor);
          float fade=verticalBounds/(1.+outside*8.);
          vec3 streaks=mix(u_bg,sliceCol,fade);
          gl_FragColor=vec4(mix(streaks,eggCol,insideMask),1.);
        }
      `
    });

    const scene=new THREE.Scene();
    const camera=new THREE.OrthographicCamera(-1,1,1,-1,0,1);
    scene.add(new THREE.Mesh(new THREE.PlaneGeometry(2,2),material));
    const started=performance.now();

    function animate(now){
      const elapsed=(now-started)/1000;
      uniforms.u_time.value=elapsed;
      uniforms.u_rotateX.value=Math.sin(elapsed*.4)*.1;
      if(elapsed>3.15){
        const t=Math.min(1,(elapsed-3.15)/1.05);
        const e=t*t*(3-2*t);
        uniforms.u_scale.value=.36+(1.25-.36)*e;
        uniforms.u_tall.value=3.2-(3.2-1.05)*e;
        uniforms.u_scanPinch.value=1.8+4.2*e;
      }
      renderer.render(scene,camera);
      requestAnimationFrame(animate);
    }
    requestAnimationFrame(animate);

    addEventListener("resize",()=>{
      renderer.setSize(innerWidth,innerHeight);
      renderer.setPixelRatio(Math.min(2,devicePixelRatio||1));
    });
  </script>
</body>
</html>
