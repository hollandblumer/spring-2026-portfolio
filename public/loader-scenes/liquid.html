<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Liquid — Multi-Pinch Bands</title>
<style>
  :root {
    --ink: rgba(255,255,255,0.92);
    --ink-dim: rgba(255,255,255,0.5);
    --line: rgba(255,255,255,0.16);
    --panel-bg: rgba(10,10,12,0.62);
    --accent: #e0704c;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    background: #050506;
    overflow: hidden;
    font-family: "Helvetica Neue", Arial, sans-serif;
  }
  canvas.webgl {
    position: fixed;
    inset: 0;
    display: block;
    width: 100%;
    height: 100%;
  }

  /* Trail 2 is presentation-only: keep the canvas clear edge to edge. */
  .ui,
  #panel {
    display: none !important;
  }

  .ui {
    position: fixed;
    inset: 0;
    pointer-events: none;
    padding: 26px 30px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    color: var(--ink);
    z-index: 5;
    mix-blend-mode: difference;
  }
  .lockup { display: flex; flex-direction: column; gap: 6px; }
  .mark {
    font-size: 15px;
    font-weight: 700;
    letter-spacing: 0.14em;
    text-transform: uppercase;
  }
  .mark .idx {
    font-weight: 400;
    letter-spacing: 0.08em;
    color: var(--ink-dim);
    margin-left: 8px;
  }
  .meta {
    display: flex;
    gap: 14px;
    font-size: 10px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--ink-dim);
  }
  .ui-row.bottom {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    gap: 24px;
  }
  .desc {
    max-width: 420px;
    font-size: 11px;
    line-height: 1.5;
    letter-spacing: 0.01em;
    color: var(--ink-dim);
    margin: 0;
  }
  .credit {
    font-size: 10px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--ink-dim);
    white-space: nowrap;
  }

  #panel {
    position: fixed;
    top: 26px;
    right: 30px;
    z-index: 10;
    width: 232px;
    padding: 18px 18px 20px;
    background: var(--panel-bg);
    border: 1px solid var(--line);
    border-radius: 10px;
    backdrop-filter: blur(10px);
    color: var(--ink);
  }
  #panel h3 {
    margin: 0 0 10px;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--ink-dim);
  }
  #panel h3:not(:first-child) { margin-top: 18px; }
  #panel label {
    display: flex;
    justify-content: space-between;
    font-size: 11px;
    letter-spacing: 0.01em;
    margin-bottom: 4px;
    color: var(--ink);
  }
  #panel .val { color: var(--accent); font-variant-numeric: tabular-nums; }
  #panel input[type="range"] {
    width: 100%;
    margin-bottom: 12px;
    accent-color: var(--accent);
    height: 3px;
  }
  #reset {
    width: 100%;
    margin-top: 6px;
    padding: 9px 0;
    background: transparent;
    border: 1px solid var(--line);
    border-radius: 6px;
    color: var(--ink);
    font-size: 10px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    cursor: pointer;
    transition: background 0.15s ease, border-color 0.15s ease;
  }
  #reset:hover {
    background: rgba(255,87,34,0.12);
    border-color: rgba(255,87,34,0.5);
  }
</style>
</head>
<body>

<canvas class="webgl"></canvas>

<div class="ui">
	<div class="lockup">
		<span class="mark">Liquid<span class="idx">/ R.09</span></span>
		<div class="meta">
			<span>Real-time WebGL · GLSL</span>
			<span>Screen-space fluid · rising type trail</span>
		</div>
	</div>

	<div class="ui-row bottom">
		<p class="desc">
			Horizontal letter trails float upward through a fluid field
			simulated frame by frame.
		</p>
		<span class="credit">Est. 2026 — 01 / 01</span>
	</div>
</div>

<div id="panel">
	<h3>3D Text</h3>
	<label>Size <span class="val" id="vSize"></span></label>
	<input type="range" id="size" min="60" max="260" step="2" value="224" />
	<label>Dissolve into liquid <span class="val" id="vDissolve"></span></label>
	<input type="range" id="dissolve" min="0" max="2" step="0.01" value="1" />
	<label>Trail rows <span class="val" id="vTurns"></span></label>
	<input type="range" id="turns" min="2" max="10" step="1" value="4" />
	<label>Letter spacing <span class="val" id="vDensity"></span></label>
	<input type="range" id="density" min="0.6" max="1.6" step="0.02" value="1" />

	<h3>3D Rotation / Depth</h3>
	<label>Tilt back (X) <span class="val" id="vRotX"></span></label>
	<input type="range" id="rotX" min="-1.5" max="0.6" step="0.01" value="0" />
	<label>Turn (Y) <span class="val" id="vRotY"></span></label>
	<input type="range" id="rotY" min="-1.2" max="1.2" step="0.01" value="0" />
	<label>Diagonal (Z) <span class="val" id="vRotZ"></span></label>
	<input type="range" id="rotZ" min="-1.2" max="1.2" step="0.01" value="0" />
	<label>Depth (lens) <span class="val" id="vFov"></span></label>
	<input type="range" id="fov" min="22" max="80" step="1" value="50" />

	<button id="reset">reset the drip</button>
</div>

<script type="importmap">
	{
		"imports": {
			"three": "https://cdnjs.cloudflare.com/ajax/libs/three.js/0.166.1/three.module.min.js"
		}
	}
</script>

<script type="module">
import * as THREE from "three";

THREE.ColorManagement.enabled = false;

let SIM_W, SIM_H;
const LAYERS = 28;

const INTRO_DUR = 2.6;
let introT0 = null;
let flightT0 = null;
const easeOutCubic = x => 1 - Math.pow(1 - x, 3);

// cfg.size controls the individual glyph size in each horizontal row.
const cfg = { size: 224, depth: 0.0, dissolve: 1.0, turns: 4, density: 1 };
// Keep the type plane front-facing while the scanline distortion moves.
const rig = { rotX: 0, rotY: 0, rotZ: 0, fov: 50 };

// A square texture leaves room for the stacked rows and their upward flight.
// Extra horizontal room prevents large lines such as “TIME COMES” from
// being cropped before the pinch effect expands them.
const TEX_W = 1800, TEX_H = 1024;

const TRAIL_LINES = ["TIME", "MELTS", "SUMMER", "TIME COMES"];

// ---- BOTTOM-TO-TOP HORIZONTAL ENTRANCE ----
// Every glyph's final resting spot in the rows is precomputed once into
// `glyphLayout`. Each frame places every glyph between an off-screen point
// below the canvas and its final position.
// Each letter starts below its own destination, so all paths stay parallel.
// Rows and letters are lightly staggered to make the trail rise in sequence.
let glyphLayout = [];
let trailRowGap = 0;

const FLIGHT_DIST = TEX_H * 0.78;
const FLIGHT_DURATION = 1.15;
const FLIGHT_MAX_STAGGER = 1.1;
const FLIGHT_SPIN_TURNS = 0;
const TEXT_ENTRANCE_TOTAL = FLIGHT_DURATION + FLIGHT_MAX_STAGGER;
const RISE_SPEED = 34;
const SPIRAL_RADIUS = 112;
const SPIRAL_TURNS = 1.65;

function buildTrailLayout() {
	const layout = [];
	const cx = TEX_W / 2;
	const measureCtx = glyphCtx || document.createElement("canvas").getContext("2d");
	measureCtx.font = `900 ${cfg.size}px "Arial Black", Impact, sans-serif`;
	const rows = Math.round(cfg.turns);
	const top = -cfg.size * 1.15;
	const span = TEX_H + cfg.size * 2.3;
	const rowGap = span / rows;
	trailRowGap = rowGap;
	const tracking = cfg.size * 0.12 * cfg.density;

	for (let row = 0; row < rows; row++) {
		const y = top + (row + 0.5) * rowGap;
		const bandText = [...TRAIL_LINES[row % TRAIL_LINES.length]];
		const bandLength = bandText.length;
		const widths = bandText.map(ch => measureCtx.measureText(ch).width);
		const bandWidth = widths.reduce((sum, width) => sum + width, 0) + tracking * (bandLength - 1);
		// Preserve the poster-scale height, but condense exceptionally wide
		// lines enough to survive the 1.2× scanline expansion with padding.
		const safeBandWidth = TEX_W * 0.64;
		const scaleX = Math.min(1, safeBandWidth / bandWidth);
		let x = cx - bandWidth / 2;
		for (let col = 0; col < bandLength; col++) {
			const ch = bandText[col];
			x += widths[col] / 2;
			const fittedX = cx + (x - cx) * scaleX;
			layout.push({ ch, x: fittedX, y, angle: 0, row, col, bandLength, scaleX });
			x += widths[col] / 2 + tracking;
		}
	}

	glyphLayout = layout;
}

function renderGlyphFrame(flightElapsed) {
	const ctx = rawGlyphCtx;
	ctx.clearRect(0, 0, TEX_W, TEX_H);
	ctx.fillStyle = "#fff";
	ctx.textAlign = "center";
	ctx.textBaseline = "middle";
	ctx.font = `900 ${cfg.size}px "Arial Black", Impact, sans-serif`;

	for (let i = 0; i < glyphLayout.length; i++) {
		const g = glyphLayout[i];
		const top = -cfg.size * 1.15;
		const span = TEX_H + cfg.size * 2.3;
		const lift = flightElapsed * 56;
		const x = g.x;
		const y = top + (((g.y - top - lift) % span) + span) % span;
		const spin = 0;
		const opacity = 1;

		ctx.save();
		ctx.globalAlpha = opacity;
		ctx.translate(x, y);
		ctx.rotate(g.angle + spin);
		ctx.scale(g.scaleX, 1);
		ctx.fillText(g.ch, 0, 0);
		ctx.restore();
	}

	// Rebuild the visible texture one scanline at a time. Four sine-shaped
	// pinch zones squeeze and expand the fixed word bands like the reference.
	glyphCtx.clearRect(0, 0, TEX_W, TEX_H);
	for (let y = 0; y < TEX_H; y++) {
		const pct = y / TEX_H;
		const pinchWave = Math.sin(pct * Math.PI * 4 - Math.PI / 2);
		const pinch = 0.4 + ((pinchWave + 1) * 0.5) * 0.8;
		const wobble = Math.sin(flightElapsed * 2.4 + y * 0.02) * 10;
		const width = TEX_W * pinch;
		const x = (TEX_W - width) * 0.5 + wobble;
		glyphCtx.drawImage(rawGlyphCanvas, 0, y, TEX_W, 1, x, y, width, 1);
	}
}

const renderer = new THREE.WebGLRenderer({
	canvas: document.querySelector(".webgl"),
	antialias: true,
});
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);

const textScene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(
	rig.fov,
	window.innerWidth / window.innerHeight,
	0.1,
	100,
);
camera.position.set(0, 0, 7.5);
camera.lookAt(0, 0, 0);

const glyphCanvas = document.createElement("canvas");
glyphCanvas.width = TEX_W; glyphCanvas.height = TEX_H;
const glyphCtx = glyphCanvas.getContext("2d");
const rawGlyphCanvas = document.createElement("canvas");
rawGlyphCanvas.width = TEX_W; rawGlyphCanvas.height = TEX_H;
const rawGlyphCtx = rawGlyphCanvas.getContext("2d");
buildTrailLayout();
renderGlyphFrame(0, 0);
const glyphTex = new THREE.CanvasTexture(glyphCanvas);
glyphTex.minFilter = THREE.LinearFilter;
glyphTex.magFilter = THREE.LinearFilter;

const textGroup = new THREE.Group();
textScene.add(textGroup);

const frontCol = new THREE.Color(0x3d2f0f);
const backCol = new THREE.Color(0x140f05);

function buildTextStack() {
	while (textGroup.children.length) {
		const m = textGroup.children.pop();
		m.geometry.dispose();
		m.material.dispose();
	}
	const H = 7.6, W = H * (TEX_W / TEX_H);
	const n = cfg.depth <= 0.001 ? 1 : LAYERS;
	for (let i = 0; i < n; i++) {
		const t = n === 1 ? 0 : i / (n - 1);
		const mat = new THREE.MeshBasicMaterial({
			map: glyphTex,
			transparent: true,
			alphaTest: 0.08,
			color: frontCol.clone().lerp(backCol, t),
			side: THREE.DoubleSide,
		});
		const mesh = new THREE.Mesh(new THREE.PlaneGeometry(W, H), mat);
		mesh.position.z = -t * cfg.depth;
		textGroup.add(mesh);
	}
}
buildTextStack();

const rtTextOpts = {
	minFilter: THREE.LinearFilter, magFilter: THREE.LinearFilter,
	format: THREE.RGBAFormat, depthBuffer: true, stencilBuffer: false,
};
const rtSimOpts = {
	minFilter: THREE.LinearFilter, magFilter: THREE.LinearFilter,
	format: THREE.RGBAFormat, type: THREE.HalfFloatType, depthBuffer: false, stencilBuffer: false,
};

let rtText, rtA, rtB;
function makeTargets() {
	SIM_H = 768;
	SIM_W = Math.max(256, Math.round(SIM_H * window.innerWidth / window.innerHeight));
	const dpr = Math.min(window.devicePixelRatio, 2);
	const TXT_W = Math.floor(window.innerWidth * dpr);
	const TXT_H = Math.floor(window.innerHeight * dpr);
	if (rtText) { rtText.dispose(); rtA.dispose(); rtB.dispose(); }
	rtText = new THREE.WebGLRenderTarget(TXT_W, TXT_H, rtTextOpts);
	rtA = new THREE.WebGLRenderTarget(SIM_W, SIM_H, rtSimOpts);
	rtB = new THREE.WebGLRenderTarget(SIM_W, SIM_H, rtSimOpts);
	if (simMat) simMat.uniforms.uTexel.value.set(1 / SIM_W, 1 / SIM_H);
	if (typeof compMat !== "undefined") {
		compMat.uniforms.uTexelC.value.set(1 / TXT_W, 1 / TXT_H);
		compMat.uniforms.uTexelS.value.set(1 / SIM_W, 1 / SIM_H);
	}
}

const simScene = new THREE.Scene();
const simCam = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);

const simMat = new THREE.ShaderMaterial({
	uniforms: {
		uPrev: { value: null },
		uSrc: { value: null },
		uTexel: { value: new THREE.Vector2(1, 1) },
		uTime: { value: 0 },
		uFrame: { value: 0 },
	},
	vertexShader: `
    varying vec2 vUv;
    void main(){ vUv = uv; gl_Position = vec4(position.xy, 0., 1.); }
  `,
	fragmentShader: `
    precision highp float;
    varying vec2 vUv;
    uniform sampler2D uPrev, uSrc;
    uniform vec2 uTexel;
    uniform float uTime, uFrame;

    const float NECK_FADE  = 0.030;
    const float NECK_KEEP  = 0.035;
    const float DROP_REACH = 5.2;
    const float TENSION    = 0.16;

    float hash(vec2 p){
      return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453);
    }
    float noise(float x){
      float i = floor(x), f = fract(x);
      float a = hash(vec2(i, 0.)), b = hash(vec2(i + 1., 0.));
      return mix(a, b, f * f * (3. - 2. * f));
    }

    void main(){
      float a0 = texture2D(uSrc, vUv).a;
      float a1 = texture2D(uSrc, vUv + vec2(uTexel.x * 0.8, 0.)).a;
      float a2 = texture2D(uSrc, vUv - vec2(uTexel.x * 0.8, 0.)).a;
      float a3 = texture2D(uSrc, vUv + vec2(0., uTexel.y * 2.5)).a;
      float a4 = texture2D(uSrc, vUv - vec2(0., uTexel.y * 2.5)).a;
      float srcA = max(max(a0, a1), max(max(a2, a3), a4));
      float src  = smoothstep(0.03, 0.16, srcA) * 0.95;
      float prev = texture2D(uPrev, vUv).r;

      float col  = vUv.x * 1024.0;

      float visc = noise(col * 0.035) * 0.5
                 + noise(col * 0.13 + 7.0) * 0.25
                 + noise(col * 0.06 + uTime * 0.07) * 0.25;

      float wob = ((noise(col * 0.08 + uTime * 0.15) - 0.5)
                +  (noise(vUv.y * 38.0 + col * 0.013 + uTime * 0.45) - 0.5) * 0.7)
                * uTexel.x * 2.2;
      float grav = 1.0 + (1.0 - vUv.y) * 1.5;
      float up1 = texture2D(uPrev, vUv + vec2(wob,        uTexel.y * grav        )).r;
      float up2 = texture2D(uPrev, vUv + vec2(wob * 1.6,  uTexel.y * 2.0 * grav  )).r;
      float up3 = texture2D(uPrev, vUv + vec2(wob * 2.3,  uTexel.y * 3.2 * grav  )).r;
      float speedN = noise(col * 0.045 + uTime * 0.12);
      float pull = mix(up1, up2, smoothstep(0.45, 0.80, speedN));
      pull = mix(pull, max(pull, up3), smoothstep(0.70, 0.97, speedN));

      float wayAbove = texture2D(uPrev, vUv + vec2(0., uTexel.y * 10.0 * grav)).r;
      float detached = (1.0 - smoothstep(0.04, 0.22, wayAbove))
                     * smoothstep(0.06, 0.30, pull)
                     * (1.0 - src);
      float upFar = texture2D(uPrev, vUv + vec2(wob * 2.0, uTexel.y * DROP_REACH * grav)).r;
      pull = max(pull, upFar * detached);

      float lf = texture2D(uPrev, vUv + vec2(-uTexel.x, uTexel.y * 0.4)).r;
      float rt = texture2D(uPrev, vUv + vec2( uTexel.x, uTexel.y * 0.4)).r;
      float side = max(lf, rt) * (0.865 + visc * 0.018);

      float screenAbove = texture2D(uPrev, vUv + vec2(0.,  uTexel.y)).r;
      float screenBelow = texture2D(uPrev, vUv + vec2(0., -uTexel.y)).r;
      float blur = (lf + rt + screenAbove + screenBelow) * 0.25;

      float lf2 = texture2D(uPrev, vUv + vec2(-uTexel.x * 2.5, 0.)).r;
      float rt2 = texture2D(uPrev, vUv + vec2( uTexel.x * 2.5, 0.)).r;
      float thin    = 1.0 - smoothstep(0.05, 0.35, max(lf2, rt2));
      float hanging = smoothstep(0.15, 0.50, screenAbove)
                    * smoothstep(0.15, 0.50, screenBelow);
      float neck   = thin * hanging * (1.0 - src);
      float breakN = smoothstep(0.45, 0.85, noise(col * 0.05 + uTime * 0.55));
      float pinch  = neck * breakN;

      float keep = 0.980 + visc * 0.019 - pinch * NECK_KEEP;
      float fall = pull * keep;

      float head = pull * (1.0 - smoothstep(0.02, 0.30, screenBelow));
      fall = max(fall, head);

      float flow = 0.36 + visc * 0.44 + 0.18 * noise(col * 0.02 + uTime * 0.30);
      flow = min(1.0, flow + detached * 0.30);

      float target = max(fall, side);
      float v = mix(prev, target, flow);
      v = mix(v, blur, TENSION);
      v = max(v, prev * (0.9965 - pinch * NECK_FADE));
      v = min(v, 1.0);
      v = max(v, src);

      gl_FragColor = vec4(v, 0., 0., 1.);
    }
  `,
});
simScene.add(new THREE.Mesh(new THREE.PlaneGeometry(2, 2), simMat));

const compScene = new THREE.Scene();
const compMat = new THREE.ShaderMaterial({
	uniforms: {
		uSim: { value: null },
		uText: { value: null },
		uTime: { value: 0 },
		uDissolve: { value: cfg.dissolve },
		uTexelC: { value: new THREE.Vector2(1, 1) },
		uTexelS: { value: new THREE.Vector2(1, 1) },
	},
	vertexShader: `
    varying vec2 vUv;
    void main(){ vUv = uv; gl_Position = vec4(position.xy, 0., 1.); }
  `,
	fragmentShader: `
    precision highp float;
    varying vec2 vUv;
    uniform sampler2D uSim, uText;
    uniform float uTime, uDissolve;
    uniform vec2 uTexelC, uTexelS;

    const float FAT_R   = 1.15;
    const float FAT_CAP = 0.24;

    float hash(vec2 p){
      return fract(sin(dot(p, vec2(269.5, 183.3)) + uTime) * 43758.5453);
    }
    float hash2(vec2 p){
      return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453);
    }
    float noise2(vec2 p){
      vec2 i = floor(p), f = fract(p);
      f = f * f * (3. - 2. * f);
      float a = hash2(i), b = hash2(i + vec2(1,0));
      float c = hash2(i + vec2(0,1)), d = hash2(i + vec2(1,1));
      return mix(mix(a, b, f.x), mix(c, d, f.x), f.y);
    }

    void main(){
      float v = texture2D(uSim, vUv).r;
      vec4 tc = texture2D(uText, vUv);

      // Keep accumulated fluid inside the centered typography corridor.
      // The soft boundary prevents yellow buildup along either screen edge.
      float corridor = smoothstep(0.20, 0.28, vUv.x)
                     * (1.0 - smoothstep(0.72, 0.80, vUv.x));
      v *= corridor;

      vec2 fo = uTexelS * FAT_R;
      float vb = v * 0.28
        + (texture2D(uSim, vUv + vec2(fo.x, 0.)).r
        +  texture2D(uSim, vUv - vec2(fo.x, 0.)).r
        +  texture2D(uSim, vUv + vec2(0., fo.y)).r
        +  texture2D(uSim, vUv - vec2(0., fo.y)).r) * 0.13
        + (texture2D(uSim, vUv + fo * 0.707).r
        +  texture2D(uSim, vUv - fo * 0.707).r
        +  texture2D(uSim, vUv + vec2(fo.x, -fo.y) * 0.707).r
        +  texture2D(uSim, vUv + vec2(-fo.x, fo.y) * 0.707).r) * 0.05;
      float fat = smoothstep(0.12, 0.44, vb) * FAT_CAP;
      float hiBand = smoothstep(0.72, 0.86, v);
      v = max(v, fat * (1.0 - hiBand));
      v *= corridor;

      float inText = smoothstep(0.25, 0.75, tc.a);
      float dripMask = 1.0 - smoothstep(0.89, 0.925, v) * (1.0 - uDissolve * inText);
      float fall1 = noise2(vec2(vUv.x * 70.0, vUv.y * 7.0 + uTime * 1.6));
      float fall2 = noise2(vec2(vUv.x * 28.0, vUv.y * 3.5 + uTime * 0.8));
      float stream = fall1 * 0.55 + fall2 * 0.45;

      // Palette lifted from the reference dot-grid: charcoal ground,
      // mustard/gold as the dominant fill, a pink-lavender sparkle accent,
      // and a single consistent coral-orange (#FA874C) at
      // the hottest peaks — never a different hue, just darker/brighter
      // versions of the same color.
      vec3 gold    = vec3(0.682, 0.522, 0.188);
      vec3 pink    = vec3(0.812, 0.565, 0.808);
      vec3 coral   = vec3(0.980, 0.529, 0.298);

      vec3 fluid = vec3(0.);
      fluid = mix(fluid, gold * 0.72, smoothstep(0.03, 0.18, v));
      fluid = mix(fluid, gold,   smoothstep(0.18, 0.50, v));
      fluid = mix(fluid, pink,   smoothstep(0.50, 0.66, v));
      fluid = mix(fluid, coral,  smoothstep(0.68, 0.78, v));
      vec3 coralShade = coral * 0.32;
      fluid = mix(fluid, coralShade, smoothstep(0.80, 0.88, v));
      fluid = mix(fluid, coral,      smoothstep(0.905, 0.928, v));

      float glow = smoothstep(0.12, 0.5, v) * (1. - smoothstep(0.55, 0.85, v));
      fluid += gold * glow * 0.35;

      fluid *= mix(1.0, 0.78 + 0.34 * stream, dripMask);

      vec3 col = vec3(0.169, 0.176, 0.208);
      float fluidA = smoothstep(0.03, 0.10, v);
      fluidA *= smoothstep(0.0, 0.12, vUv.y);
      col = mix(col, fluid, fluidA);

      vec3 tcol = tc.rgb / max(tc.a, 0.001);
      float ta = smoothstep(0.25, 0.75, tc.a);
      col = mix(col, tcol, ta * (1.0 - uDissolve));

      float grainMask = max(fluidA, ta);
      col += (hash(gl_FragCoord.xy * 0.7) - 0.5) * 0.10 * grainMask;

      gl_FragColor = vec4(col, 1.0);
    }
  `,
});
compScene.add(new THREE.Mesh(new THREE.PlaneGeometry(2, 2), compMat));

makeTargets();

function clearSim() {
	renderer.setRenderTarget(rtA); renderer.setClearColor(0x000000, 0); renderer.clear();
	renderer.setRenderTarget(rtB); renderer.clear();
	renderer.setRenderTarget(null);
	frame = 0;
	introT0 = null;
	flightT0 = null;
}
function rebuildText() {
	buildTrailLayout();
	clearSim();
}
const _H = 7.6, _W = _H * (TEX_W / TEX_H);
const _corners = [
	new THREE.Vector3(-_W / 2, -_H / 2, 0), new THREE.Vector3(_W / 2, -_H / 2, 0),
	new THREE.Vector3(_W / 2, _H / 2, 0), new THREE.Vector3(-_W / 2, _H / 2, 0),
];
const _v = new THREE.Vector3();
let centerX = 0;
function recenterTextX() {
	textGroup.position.x = 0;
	textGroup.updateMatrixWorld(true);
	const a = _v.set(0, 0, 0).project(camera).x;
	const b = _v.set(1, 0, 0).project(camera).x;
	const ndcPerWorld = b - a;
	for (let it = 0; it < 4; it++) {
		let min = Infinity, max = -Infinity;
		for (const c of _corners) {
			_v.copy(c).applyEuler(textGroup.rotation);
			_v.x += textGroup.position.x;
			_v.project(camera);
			if (_v.x < min) min = _v.x;
			if (_v.x > max) max = _v.x;
		}
		const centerNdc = (min + max) * 0.5;
		if (Math.abs(centerNdc) < 0.0005) break;
		textGroup.position.x -= centerNdc / ndcPerWorld;
	}
	centerX = textGroup.position.x;
}
function applyRig() {
	textGroup.rotation.set(rig.rotX, rig.rotY, rig.rotZ);
	camera.fov = rig.fov;
	const halfFov = THREE.MathUtils.degToRad(camera.fov * 0.5);
	const distanceForHeight = (_H * 0.5) / Math.tan(halfFov);
	const distanceForWidth = (_W * 0.5) / (Math.tan(halfFov) * camera.aspect);
	camera.position.z = Math.max(distanceForHeight, distanceForWidth) * 1.08;
	camera.updateProjectionMatrix();
	recenterTextX();
}
function bindSlider(id, obj, key, labelId, fmt, onChange) {
	const el = document.getElementById(id);
	const lab = document.getElementById(labelId);
	const update = () => {
		obj[key] = parseFloat(el.value);
		lab.textContent = fmt(obj[key]);
		onChange();
	};
	el.addEventListener("input", update);
	lab.textContent = fmt(obj[key]);
}
bindSlider("size", cfg, "size", "vSize", v => v + "px", rebuildText);
bindSlider("dissolve", cfg, "dissolve", "vDissolve", v => Math.round(v * 100) + "%",
					 () => { compMat.uniforms.uDissolve.value = cfg.dissolve; });
bindSlider("turns", cfg, "turns", "vTurns", v => Math.round(v), rebuildText);
bindSlider("density", cfg, "density", "vDensity", v => v.toFixed(2) + "×", rebuildText);
bindSlider("rotX", rig, "rotX", "vRotX", v => v.toFixed(2) + " rad", applyRig);
bindSlider("rotY", rig, "rotY", "vRotY", v => v.toFixed(2) + " rad", applyRig);
bindSlider("rotZ", rig, "rotZ", "vRotZ", v => v.toFixed(2) + " rad", applyRig);
bindSlider("fov", rig, "fov", "vFov", v => v + "°", applyRig);
document.getElementById("reset").addEventListener("click", clearSim);
applyRig();

let frame = 0;
let running = true;
let startMs = performance.now();
clearSim();

document.addEventListener("visibilitychange", () => {
	if (document.hidden) {
		running = false;
		pausedMs = performance.now();
	} else if (!running) {
		startMs += performance.now() - pausedMs;
		running = true;
		animate();
	}
});
let pausedMs = 0;

function animate() {
	if (!running) return;
	requestAnimationFrame(animate);
	const t = (performance.now() - startMs) / 1000;

	textGroup.position.x = centerX;
	textGroup.position.y = 0;

	if (flightT0 === null) flightT0 = t;
	const flightElapsed = t - flightT0;
	renderGlyphFrame(flightElapsed);
	glyphTex.needsUpdate = true;

	if (introT0 === null && flightElapsed >= TEXT_ENTRANCE_TOTAL) introT0 = t;
	if (introT0 === null) {
		compMat.uniforms.uDissolve.value = 1.0;
		textGroup.scale.setScalar(1.0);
	} else {
		const ip = Math.min((t - introT0) / INTRO_DUR, 1);
		if (ip < 1) {
			const e = easeOutCubic(ip);
			compMat.uniforms.uDissolve.value = 1.0 + (cfg.dissolve - 1.0) * e;
			textGroup.scale.setScalar(1.0 + (1.0 - e) * 0.07);
		} else {
			compMat.uniforms.uDissolve.value = cfg.dissolve;
			textGroup.scale.setScalar(1.0);
		}
	}

	renderer.setRenderTarget(rtText);
	renderer.setClearColor(0x000000, 0);
	renderer.clear();
	renderer.render(textScene, camera);

	for (let i = 0; i < 4; i++) {
		simMat.uniforms.uPrev.value = rtA.texture;
		simMat.uniforms.uSrc.value = rtText.texture;
		simMat.uniforms.uTime.value = t;
		simMat.uniforms.uFrame.value = frame++;
		renderer.setRenderTarget(rtB);
		renderer.render(simScene, simCam);
		[rtA, rtB] = [rtB, rtA];
	}

	renderer.setRenderTarget(null);
	compMat.uniforms.uSim.value = rtA.texture;
	compMat.uniforms.uText.value = rtText.texture;
	compMat.uniforms.uTime.value = t;
	renderer.render(compScene, simCam);
}
animate();

let resizeTimer;
window.addEventListener("resize", () => {
	clearTimeout(resizeTimer);
	resizeTimer = setTimeout(() => {
		camera.aspect = window.innerWidth / window.innerHeight;
		renderer.setSize(window.innerWidth, window.innerHeight);
		makeTargets();
		applyRig();
		clearSim();
	}, 150);
});
</script>
</body>
