<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>WebGL Column Gallery</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root{--ease:cubic-bezier(.19,1,.22,1)}
    *{box-sizing:border-box;margin:0;padding:0;user-select:none}
    html,body{width:100%;height:100%;overflow:hidden;background:transparent;color:#fff;font-family:"Instrument Serif",serif;overscroll-behavior:none}
    body>canvas{position:fixed;inset:0;width:100%;height:100%;cursor:grab}
    body>canvas.dragging{cursor:grabbing}
    body.open>canvas{cursor:pointer}
    header{position:fixed;z-index:3;top:0;left:0;width:100%;height:80px;padding:0 32px;display:flex;align-items:center;justify-content:space-between;font-size:16px;pointer-events:none}
    header a{color:#fff;text-decoration:none;pointer-events:auto}
    nav{display:flex;gap:16px}
    a:focus-visible{outline:1px solid #fff;outline-offset:4px}
    .fade{position:fixed;z-index:2;pointer-events:none}
    .top,.bottom{left:0;width:100%;height:160px}
    .top{top:0;background:linear-gradient(rgb(255 255 255 / 14%),transparent)}
    .bottom{bottom:0;background:linear-gradient(transparent,rgb(255 255 255 / 14%))}
    .left,.right{top:0;width:160px;height:100%}
    .left{left:0;background:linear-gradient(90deg,rgb(255 255 255 / 14%),transparent)}
    .right{right:0;background:linear-gradient(90deg,transparent,rgb(255 255 255 / 14%))}
    .index{position:fixed;z-index:3;left:32px;bottom:28px;font-size:15px;letter-spacing:.01em;pointer-events:none}
    .badge{position:fixed;z-index:3;bottom:24px;left:50%;transform:translateX(-50%);height:50px;padding:4px;border:1px solid #ffffff1a;border-radius:99px;background:#ffffff0a;backdrop-filter:blur(10px);display:grid;place-items:center}
    .badge div{width:64px;height:40px;border-radius:99px;background:#ffffff0b;display:grid;place-items:center;filter:drop-shadow(0 0 6px #fff8)}
    .cursor{position:fixed;z-index:4;width:56px;height:56px;border:1px solid #ffffff2e;border-radius:50%;background:#ffffff0a;backdrop-filter:blur(10px);display:none;place-items:center;pointer-events:none;transform:translate(-50%,-50%) scale(.7);opacity:0;transition:opacity .25s,transform .5s var(--ease)}
    body.hovering .cursor,body.open .cursor{display:none;opacity:0}
    .cursor span{font-family:Inter,Arial,sans-serif;font-size:12px;letter-spacing:.02em}
    body.open .cursor span{font-family:"Instrument Serif",serif;font-size:22px;line-height:1}

    /* page chrome holds back until the reveal lands */
    header,.badge,.index,.fade{opacity:0;transition:opacity .9s ease}
    body.ready header,body.ready .badge,body.ready .index,body.ready .fade{opacity:1}
    body.ready .fade{transition-delay:.35s}
    body.ready header{transition-delay:.5s}
    body.ready .index{transition-delay:.65s}
    body.ready .badge{transition-delay:.8s}

    /* loader — the counter is drawn in WebGL, this is just its shell */
    .loader{position:fixed;inset:0;z-index:20;pointer-events:none;overflow:hidden}
    .loader.is-done{visibility:hidden}
    .loader-bg{position:absolute;inset:0;background:#000;transition:opacity .5s ease}
    .loader.is-exiting .loader-bg{opacity:0}
    .loader canvas{position:absolute;inset:0;display:block;width:100%;height:100%}
    .sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}

    @media(max-width:768px){
      header{height:64px;padding:0 18px}
      .fade{display:none!important}
      .top,.bottom{height:100px}
      .left,.right{width:100px}
      .badge{bottom:16px}
      .index{left:18px;bottom:22px;font-size:13px}
      .cursor{display:none!important}
    }
    @media(hover:none),(pointer:coarse){.fade{display:none!important}}
    @media(prefers-reduced-motion:reduce){
      .cursor{transition:none}
    }
  </style>
</head>
<body>
  <div class="fade top"></div><div class="fade right"></div><div class="fade bottom"></div><div class="fade left"></div>
  <div class="cursor"><span>View</span></div>

  <div class="loader" id="loader" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" aria-label="Loading gallery">
    <span class="sr-only" id="loaderStatus">loading 0 percent</span>
    <div class="loader-bg"></div>
    <canvas id="loaderCanvas" aria-hidden="true"></canvas>
  </div>

  <!-- classic script: defines window.Loader before the module body runs -->
  <script>
  (function () {
    "use strict";

    var CONFIG = {
      label: "loading",
      digits: 3,
      background: [0.0, 0.0, 0.0],
      text: [1.0, 1.0, 1.0],
      fontStack: 'Inter, "Helvetica Neue", system-ui, sans-serif',
      fontWeight: 700,
      glyphFill: 0.34,
      lensRadius: 0.44,
      thickness: 1.20,
      ior: 1.35,
      dispersion: 0.05,
      barrel: 0.26,
      compensate: 0.5,
      vignette: 0.24,
      splitStrength: 0.007,
      autoCeiling: 0.94,
      swellMax: 0.30,
      refractFloor: 0.00,
      refractPeak: 0.70,
      lensProfile: 0.80,
      finishMs: 300,
      holdMs: 120,
      entryPeak: 0.45,
      entryMs: 720,
      exitMs: 720,
      simulateMs: 3200
    };

    var loaderEl = document.getElementById("loader");
    var srEl = document.getElementById("loaderStatus");
    var canvas = document.getElementById("loaderCanvas");
    var gl = canvas.getContext("webgl", { antialias: false, alpha: true, premultipliedAlpha: true });

    function announceDone() {
      window.Loader.finished = true;
      window.dispatchEvent(new CustomEvent("loader:complete"));
    }

    if (!gl) {
      window.Loader = { set: function () {}, complete: function () {}, exiting: true, finished: true, config: CONFIG };
      loaderEl.classList.add("is-done");
      return;
    }

    var SCREEN_VS =
      "attribute vec2 aPos; varying vec2 vUv;" +
      "void main(){ vUv = aPos + 0.5; gl_Position = vec4(aPos * 2.0, 0.0, 1.0); }";

    var LOADER_FS =
      "precision highp float; varying vec2 vUv;" +
      "uniform sampler2D uGlyph;" +
      "uniform vec3 uBackground; uniform vec3 uText; uniform vec2 uParallax;" +
      "uniform float uExit;" +
      "void main(){" +
      "vec2 uv = clamp(vUv + uParallax, 0.001, 0.999);" +
      "vec3 color = uBackground;" +
      "float glyph = texture2D(uGlyph, uv).a;" +
      "color = mix(color, uText, glyph);" +
      "color = mix(color, uBackground, uExit);" +
      "gl_FragColor = vec4(color, 1.0); }";

    var TRAIL_FS =
      "precision highp float; varying vec2 vUv; uniform sampler2D uPrevious;" +
      "uniform vec2 uPointer; uniform float uActive;" +
      "void main(){ float previous = texture2D(uPrevious, vUv).r * 0.945;" +
      "float stamp = (1.0 - smoothstep(0.0, 0.115, distance(vUv, uPointer))) * uActive;" +
      "float value = max(previous, stamp); gl_FragColor = vec4(value, value, value, 1.0); }";

    var POST_FS =
      "precision highp float; varying vec2 vUv;" +
      "uniform sampler2D uScene; uniform sampler2D uTrail;" +
      "uniform float uExit; uniform float uBarrel; uniform float uCompensate;" +
      "uniform float uSplit; uniform float uVignette; uniform float uAspect;" +
      "uniform float uLensRadius; uniform float uThickness; uniform float uIor; uniform float uDispersion;" +
      "uniform float uRefract; uniform float uProfile;" +
      "vec2 lensOffset(vec3 normal, float eta, float scale) {" +
      "  vec3 bent = refract(vec3(0.0, 0.0, -1.0), normal, eta);" +
      "  return bent.xy * scale / vec2(uAspect, 1.0);" +
      "}" +
      "void main(){" +
      "vec2 center = vUv - 0.5;" +
      "float r2 = dot(center, center);" +
      "float k = uBarrel + uExit * 0.85;" +
      "float gain = mix(1.0, 1.0 / max(0.35, 1.0 - k * 0.5), uCompensate);" +
      "vec2 buv = center * (1.0 - k * r2) * gain * (1.0 - uExit * 0.06) + 0.5;" +
      "vec2 p = (buv - 0.5) * vec2(uAspect, 1.0) / max(0.05, uLensRadius);" +
      "float d = length(p);" +
      "vec2 offR = vec2(0.0); vec2 offG = vec2(0.0); vec2 offB = vec2(0.0);" +
      "if (d < 1.0) {" +
      "  float z = pow(max(0.0001, 1.0 - d * d), uProfile);" +
      "  vec3 normal = normalize(vec3(p, z));" +
      "  float scale = uThickness * uLensRadius * uRefract * 2.5;" +
      "  offR = lensOffset(normal, 1.0 / max(1.001, uIor - uDispersion), scale);" +
      "  offG = lensOffset(normal, 1.0 / max(1.001, uIor), scale);" +
      "  offB = lensOffset(normal, 1.0 / max(1.001, uIor + uDispersion), scale);" +
      "}" +
      "float trail = texture2D(uTrail, vUv).r;" +
      "float split = trail * uSplit + uExit * 0.016;" +
      "vec2 rgbOffset = vec2(split, split * 0.45);" +
      "float blur = trail * uSplit * 0.375;" +
      "vec3 color;" +
      "color.r = texture2D(uScene, clamp(buv + offR + rgbOffset, 0.001, 0.999)).r;" +
      "color.g = texture2D(uScene, clamp(buv + offG, 0.001, 0.999)).g;" +
      "color.b = texture2D(uScene, clamp(buv + offB - rgbOffset, 0.001, 0.999)).b;" +
      "vec2 base = clamp(buv + offG, 0.001, 0.999);" +
      "color += texture2D(uScene, clamp(base + vec2(blur, 0.0), 0.001, 0.999)).rgb;" +
      "color += texture2D(uScene, clamp(base - vec2(blur, 0.0), 0.001, 0.999)).rgb;" +
      "color += texture2D(uScene, clamp(base + vec2(0.0, blur), 0.001, 0.999)).rgb;" +
      "color += texture2D(uScene, clamp(base - vec2(0.0, blur), 0.001, 0.999)).rgb;" +
      "color /= 5.0;" +
      "float rim = smoothstep(0.90, 1.0, d) * (1.0 - step(1.0, d));" +
      "color += rim * 0.11 * uRefract * (1.0 - uExit);" +
      "color *= 1.0 - uVignette * smoothstep(0.05, 0.55, r2);" +
      "float alpha = max(max(color.r, color.g), color.b);" +
      "gl_FragColor = vec4(color, alpha); }";

    function compile(vsSource, fsSource) {
      function shader(type, source) {
        var s = gl.createShader(type);
        gl.shaderSource(s, source);
        gl.compileShader(s);
        if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) console.error(gl.getShaderInfoLog(s));
        return s;
      }
      var program = gl.createProgram();
      gl.attachShader(program, shader(gl.VERTEX_SHADER, vsSource));
      gl.attachShader(program, shader(gl.FRAGMENT_SHADER, fsSource));
      gl.linkProgram(program);
      var wrapped = { program: program, u: {} };
      var count = gl.getProgramParameter(program, gl.ACTIVE_UNIFORMS);
      for (var i = 0; i < count; i++) {
        var info = gl.getActiveUniform(program, i);
        wrapped.u[info.name] = gl.getUniformLocation(program, info.name);
      }
      wrapped.aPos = gl.getAttribLocation(program, "aPos");
      return wrapped;
    }

    var loaderProg = compile(SCREEN_VS, LOADER_FS);
    var trailProg = compile(SCREEN_VS, TRAIL_FS);
    var postProg = compile(SCREEN_VS, POST_FS);

    var quad = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, quad);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-0.5, -0.5, 0.5, -0.5, -0.5, 0.5, 0.5, 0.5]), gl.STATIC_DRAW);

    function bindQuad(prog) {
      gl.bindBuffer(gl.ARRAY_BUFFER, quad);
      gl.enableVertexAttribArray(prog.aPos);
      gl.vertexAttribPointer(prog.aPos, 2, gl.FLOAT, false, 0, 0);
    }

    function makeTexture() {
      var tex = gl.createTexture();
      gl.bindTexture(gl.TEXTURE_2D, tex);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
      return tex;
    }

    function makeFBO(width, height) {
      var tex = makeTexture();
      gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, width, height, 0, gl.RGBA, gl.UNSIGNED_BYTE, null);
      var fbo = gl.createFramebuffer();
      gl.bindFramebuffer(gl.FRAMEBUFFER, fbo);
      gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, tex, 0);
      gl.bindFramebuffer(gl.FRAMEBUFFER, null);
      return { fbo: fbo, tex: tex, w: width, h: height };
    }

    var trailA = makeFBO(256, 256);
    var trailB = makeFBO(256, 256);
    var sceneTarget = makeFBO(2, 2);

    var glyphCanvas = document.createElement("canvas");
    var glyphTex = makeTexture();

    function drawGlyphs(text) {
      var ctx = glyphCanvas.getContext("2d");
      var width = glyphCanvas.width;
      var height = glyphCanvas.height;
      ctx.clearRect(0, 0, width, height);
      ctx.fillStyle = "#ffffff";
      ctx.textBaseline = "alphabetic";

      var probe = 400;
      ctx.font = CONFIG.fontWeight + " " + probe + "px " + CONFIG.fontStack;

      var cell = 0;
      var digits = "0123456789";
      for (var i = 0; i < digits.length; i++) cell = Math.max(cell, ctx.measureText(digits[i]).width);
      var reference = ctx.measureText("8");
      var glyphHeight = reference.actualBoundingBoxAscent + reference.actualBoundingBoxDescent;
      if (!cell || !glyphHeight) return;

      var scale = Math.min(
        (width * CONFIG.glyphFill) / (cell * Math.max(text.length, CONFIG.digits)),
        (height * CONFIG.glyphFill) / glyphHeight
      );
      var size = probe * scale;
      var cellWidth = cell * scale;

      ctx.font = CONFIG.fontWeight + " " + size + "px " + CONFIG.fontStack;
      var fitted = ctx.measureText("8");
      var baseline = height / 2 + (fitted.actualBoundingBoxAscent - fitted.actualBoundingBoxDescent) / 2;

      var x = width / 2 - (cellWidth * text.length) / 2;
      for (var k = 0; k < text.length; k++) {
        var advance = ctx.measureText(text[k]).width;
        ctx.fillText(text[k], x + (cellWidth - advance) / 2, baseline);
        x += cellWidth;
      }

      gl.bindTexture(gl.TEXTURE_2D, glyphTex);
      gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, true);
      gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, glyphCanvas);
    }

    var reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    var MAX_TEXTURE_PIXELS = 2560;
    var target = 0, displayed = 0, renderedPercent = -1;
    var exit = 0, entry = 0, completeAt = 0, exitStarted = false;
    var finished = false, running = false, manual = false;
    var startedAt = 0, frameId = 0, previousTime = 0, aspect = 1;
    var pointerX = 0.5, pointerY = 0.5;
    var parX = 0, parY = 0, curParX = 0, curParY = 0;
    var lastMove = -Infinity, trailActive = 0;
    var handoff = 0, displayedVel = 0, countSlipY = 0, swellPos = 0, swellVel = 0;
    var finishing = false, finishFrom = 0, finishAt = 0;

    /* critically damped: unlike exponential smoothing, velocity stays
       continuous when the target jumps, so asset callbacks do not lurch */
    function spring(pos, vel, goal, omega, dt) {
      var f = 1 + 2 * dt * omega;
      var oo = omega * omega;
      var dto = dt * oo;
      var nv = (vel + dto * (goal - pos)) / (f + dt * dto);
      return [pos + dt * nv, nv];
    }

    function resize() {
      var width = Math.max(1, loaderEl.clientWidth);
      var height = Math.max(1, loaderEl.clientHeight);
      var dpr = Math.min(window.devicePixelRatio || 1, 2);
      canvas.width = Math.round(width * dpr);
      canvas.height = Math.round(height * dpr);
      aspect = canvas.width / canvas.height;

      var scale = Math.min(1, MAX_TEXTURE_PIXELS / Math.max(canvas.width, canvas.height));
      glyphCanvas.width = Math.max(2, Math.round(canvas.width * scale));
      glyphCanvas.height = Math.max(2, Math.round(canvas.height * scale));

      sceneTarget.w = canvas.width;
      sceneTarget.h = canvas.height;
      gl.bindTexture(gl.TEXTURE_2D, sceneTarget.tex);
      gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, sceneTarget.w, sceneTarget.h, 0, gl.RGBA, gl.UNSIGNED_BYTE, null);

      renderedPercent = -1;
    }

    window.addEventListener("resize", function () { if (!finished) resize(); });

    /* the shell is pointer-events:none, so listen on window */
    window.addEventListener("pointermove", function (event) {
      if (finished) return;
      var x = event.clientX / window.innerWidth;
      var y = event.clientY / window.innerHeight;
      pointerX = x;
      pointerY = 1 - y;
      parX = Math.max(-0.012, Math.min(0.012, (x - 0.5) * 0.02));
      parY = Math.max(-0.012, Math.min(0.012, (0.5 - y) * 0.02));
      lastMove = performance.now();
    });

    /* webfont may land after the first draw — force a redraw when it does */
    if (document.fonts && document.fonts.ready) {
      document.fonts.ready.then(function () { renderedPercent = -1; });
    }

    function finish() {
      finished = true;
      running = false;
      window.cancelAnimationFrame(frameId);
      loaderEl.classList.add("is-done");
      announceDone();
      var lose = gl.getExtension("WEBGL_lose_context");
      if (lose) lose.loseContext();
    }

    function frame() {
      frameId = window.requestAnimationFrame(frame);
      var now = performance.now();
      var delta = Math.min((now - previousTime) / 1000, 0.05);
      previousTime = now;
      var displayedBeforeFrame = displayed;

      if (!manual) {
        var t = Math.min(1, (now - startedAt) / CONFIG.simulateMs);
        target = (1 - Math.pow(1 - t, 2.2)) * CONFIG.autoCeiling;
      }

      if (finishing) {
        var ft = Math.min(1, (now - finishAt) / Math.max(1, CONFIG.finishMs));
        displayed = finishFrom + (1 - finishFrom) * (1 - Math.pow(1 - ft, 2));
        displayedVel = 0;
        if (ft >= 1) displayed = 1;
      } else {
        var st = spring(displayed, displayedVel, target, 5.5, delta);
        displayed = Math.min(1, st[0]); displayedVel = st[1];
      }

      /* Echo the gallery's active-scroll slip while the count is moving. */
      var countSpeed = delta > 0 ? (displayed - displayedBeforeFrame) / delta : 0;
      var countSlipTarget = reduceMotion ? 0 : Math.max(-0.105, Math.min(0.105, -countSpeed * 0.24));
      countSlipY += (countSlipTarget - countSlipY) * (1 - Math.exp(-delta * 8));

      var percent = Math.round(displayed * 100);
      if (percent !== renderedPercent) {
        drawGlyphs(String(percent));
        renderedPercent = percent;
        loaderEl.setAttribute("aria-valuenow", percent);
        srEl.textContent = CONFIG.label + " " + percent + " percent";
      }

      if (displayed >= 1 && !completeAt) completeAt = now + CONFIG.holdMs;
      if (completeAt && now >= completeAt) {
        if (!exitStarted) {
          exitStarted = true;
          window.Loader.exiting = true;
          loaderEl.classList.add("is-exiting");
          window.dispatchEvent(new CustomEvent("loader:exit"));
        }
        exit = Math.min(1, exit + delta * (1000 / Math.max(1, CONFIG.exitMs)));
      }
      var easedExit = exit * exit * (3 - 2 * exit);

      entry = Math.min(1, entry + delta * (1000 / Math.max(1, CONFIG.entryMs)));
      var easedEntry = entry * entry * (3 - 2 * entry);
      var entryPart = reduceMotion ? 0 : (1 - easedEntry) * CONFIG.entryPeak;
      var burst = Math.max(entryPart, easedExit);

      /* the lens intensifies as the counter climbs, so 100 arrives already
         most of the way into the blowout; the exit carries it the rest */
      var sw = spring(swellPos, swellVel, Math.pow(displayed, 2.2) * CONFIG.swellMax, 3.2, delta);
      swellPos = sw[0]; swellVel = sw[1];
      var base = reduceMotion ? 0 : Math.max(entryPart, swellPos);
      var intensity = base + (1 - base) * easedExit;

      /* refraction climbs across the count on its own curve, so the rim
         ghosts build from 0 to 100 instead of holding flat */
      var countRatio = Math.min(1, swellPos / Math.max(0.0001, CONFIG.swellMax));
      var refractDrive = Math.max(
        intensity,
        CONFIG.refractFloor + (CONFIG.refractPeak - CONFIG.refractFloor) * countRatio
      );

      var pointerActive = !reduceMotion && now - lastMove < 1200 ? 1 : 0;
      if (!reduceMotion) {
        if (!pointerActive) { parX *= 0.94; parY *= 0.94; }
        curParX += (parX - curParX) * 0.06;
        curParY += (parY - curParY) * 0.06;
      }
      trailActive += (pointerActive - trailActive) * 0.08;

      gl.bindFramebuffer(gl.FRAMEBUFFER, trailB.fbo);
      gl.viewport(0, 0, trailB.w, trailB.h);
      gl.useProgram(trailProg.program);
      bindQuad(trailProg);
      gl.activeTexture(gl.TEXTURE0);
      gl.bindTexture(gl.TEXTURE_2D, trailA.tex);
      gl.uniform1i(trailProg.u.uPrevious, 0);
      gl.uniform2f(trailProg.u.uPointer, pointerX, pointerY);
      gl.uniform1f(trailProg.u.uActive, trailActive);
      gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
      var swap = trailA; trailA = trailB; trailB = swap;

      gl.bindFramebuffer(gl.FRAMEBUFFER, sceneTarget.fbo);
      gl.viewport(0, 0, sceneTarget.w, sceneTarget.h);
      gl.useProgram(loaderProg.program);
      bindQuad(loaderProg);
      gl.activeTexture(gl.TEXTURE0);
      gl.bindTexture(gl.TEXTURE_2D, glyphTex);
      gl.uniform1i(loaderProg.u.uGlyph, 0);
      gl.uniform3fv(loaderProg.u.uBackground, CONFIG.background);
      gl.uniform3fv(loaderProg.u.uText, CONFIG.text);
      var ballX = reduceMotion ? 0 : Math.sin(now * 0.00115) * 0.008;
      var ballY = reduceMotion ? 0 : Math.sin(now * 0.00155 + 1.2) * 0.006;
      gl.uniform2f(loaderProg.u.uParallax, curParX + ballX, curParY + countSlipY + ballY);
      gl.uniform1f(loaderProg.u.uExit, burst);
      gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);

      gl.bindFramebuffer(gl.FRAMEBUFFER, null);
      gl.viewport(0, 0, canvas.width, canvas.height);
      gl.useProgram(postProg.program);
      bindQuad(postProg);
      gl.activeTexture(gl.TEXTURE0);
      gl.bindTexture(gl.TEXTURE_2D, sceneTarget.tex);
      gl.uniform1i(postProg.u.uScene, 0);
      gl.activeTexture(gl.TEXTURE1);
      gl.bindTexture(gl.TEXTURE_2D, trailA.tex);
      gl.uniform1i(postProg.u.uTrail, 1);
      gl.uniform1f(postProg.u.uExit, reduceMotion ? 0 : intensity);
      gl.uniform1f(postProg.u.uBarrel, CONFIG.barrel);

        effectStrength=THREE.MathUtils.clamp(Number(event.data.value)||0,0,1.6);
        return;
      }
      if(event.data?.type==='portfolio-grid-glass-rects'){
        const rects=Array.isArray(event.data.rects)?event.data.rects:[];
        postMat.uniforms.uGlassRects.value.forEach((uniform,index)=>{const rect=rects[index];uniform.set(...(Array.isArray(rect)&&rect.length===4?rect:[0,0,0,0]))});
        return;
      }
      if(event.data?.type==='portfolio-grid-video-playback'){
        videosPaused=event.data.paused===true;
        if(videosPaused)for(const surface of liveVideoSurfaces)surface.video.pause();
        if(videosPaused)typeExperimentVideo?.video.pause();
        else if(typeExperimentVideoStarted)typeExperimentVideo?.video.play().catch(()=>{});
        return;
      }
      if(event.data?.type!=='portfolio-grid-filter')return;
      const indices=[...new Set((event.data.indices||[]).filter(index=>Number.isInteger(index)&&index>=0&&index<textures.length))];
      if(!indices.length)return;
      const isAllFilter=event.data.filter==='all';
      compactFilter=false;
      staticFilter=!isAllFilter;
      visibleCardCount=isAllFilter?indices.length+1:indices.length;
      columns=Math.min(innerWidth<=768?2:3,visibleCardCount);
      velocity=0;
      cards.forEach((card,i)=>{
        card.visible=i<visibleCardCount;
        card.userData.col=i%columns;
        card.userData.row=Math.floor(i/columns);
        if(!card.visible){card.material.uniforms.uOpacity.value=0;group.remove(card);return}
        if(card.parent!==group)group.add(card);
        if(introDone)card.material.uniforms.uOpacity.value=1;
        const projectIndex=indices[i%indices.length],texture=projectIndex===2&&typeExperimentVideoStarted?typeExperimentVideo.texture:textures[projectIndex],image=texture.image;
        card.userData.projectIndex=projectIndex;
        card.userData.heightScale=projectHeightScale(projectIndex);
        setCardScale(card,cardScale);
        card.material.uniforms.uTexture.value=texture;
        card.material.uniforms.uAspect.value=card.userData.cardAspect/card.userData.heightScale;
        card.material.uniforms.uTexParallax.value=isVideoProject(projectIndex)?centeredTextureOffset:texParallax;
        card.material.uniforms.uSelectFit.value=isVideoProject(projectIndex)?1:.92;
        card.material.uniforms.uImageAspect.value=image?.videoWidth&&image?.videoHeight?image.videoWidth/image.videoHeight:image?.width&&image?.height?image.width/image.height:card.userData.cardAspect;
        card.material.uniforms.uVideoColorFix.value=0;
      });
      rows=Math.max(1,Math.ceil(visibleCardCount/columns));total=Math.max(spacingY,rows*spacingY);
      const startOffset=isAllFilter?total/2-spacingY:0;
      targetY=currentY=startOffset;resize();
    });

    function resize(){renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();postMat.uniforms.uAspect.value.set(camera.aspect,1);const nextColumns=Math.min(innerWidth<=768?2:3,visibleCardCount);if(nextColumns!==columns){columns=nextColumns;rows=Math.max(1,Math.ceil(visibleCardCount/columns));for(let i=0;i<cards.length;i++){cards[i].userData.col=i%columns;cards[i].userData.row=Math.floor(i/columns)}}const visibleH=2*Math.tan(75*Math.PI/360)*camera.position.z,visibleW=visibleH*camera.aspect,widthScale=visibleW/(columns===2?2.25:3.35);cardScale=Math.min(.92,widthScale);spacingX=cardScale*1.04;spacingY=cardScale*CARD_HEIGHT+cardScale*.05;total=Math.max(spacingY,rows*spacingY);staticScrollMax=staticFilter?Math.max(0,(rows-1)*spacingY-.28):0;if(staticFilter){targetY=THREE.MathUtils.clamp(targetY,0,staticScrollMax);currentY=THREE.MathUtils.clamp(currentY,0,staticScrollMax)}for(const card of cards)if(card!==selected&&introDone)setCardScale(card,cardScale);const p=Math.min(devicePixelRatio,2);sceneTarget.setSize(Math.max(1,innerWidth*p),Math.max(1,innerHeight*p));layout()}
    addEventListener('resize',resize);resize();

    function animate(){
      requestAnimationFrame(animate);
      const now=performance.now(),dt=Math.min(clock.getDelta(),.05);
      if(!dragging&&!selected){if(staticFilter){targetY=THREE.MathUtils.clamp(targetY+velocity,0,staticScrollMax);velocity*=.88}else{targetY+=velocity;velocity*=.92;targetY+=.025*dt}}
      currentY+=(targetY-currentY)*.08;layout();

      /* intro: cards rise in behind the opening lens, nearest the centre first */
      if(!introDone){
        if(revealAt){
          if(!cards[0].userData.delayed){for(const card of cards){card.userData.introDelay=Math.min(1.1,Math.hypot(card.position.x,card.position.y)*.24);card.userData.delayed=true}}
          reveal=easeInOut(Math.min(1,(now-revealAt)/revealMs));
          const it=(now-revealAt)/1000;
          for(const card of cards){
            const p=Math.min(1,Math.max(0,(it-card.userData.introDelay)/introSec)),e=1-Math.pow(1-p,3);
            card.material.uniforms.uOpacity.value=e;
            const s=cardScale*(.88+.12*e);setCardScale(card,s);
          }
          if(reveal>=1){introDone=true;reveal=1;document.body.classList.add('done');for(const card of cards){card.material.uniforms.uOpacity.value=1;setCardScale(card,cardScale)}setTimeout(()=>parent.postMessage('portfolio-loader-complete',location.origin),450)}
        }
      }
      if(introDone&&!videosPaused&&!typeExperimentVideoStarted&&typeExperimentVideo&&now-revealAt>revealMs+900){
        typeExperimentVideoStarted=true;typeExperimentVideo.video.play().catch(()=>{});
        for(const card of cards)if(card.userData.projectIndex===2){card.material.uniforms.uTexture.value=typeExperimentVideo.texture;card.material.uniforms.uImageAspect.value=typeExperimentVideo.video.videoWidth/typeExperimentVideo.video.videoHeight;card.material.uniforms.uVideoColorFix.value=0}
      }
      if(!videosPaused&&typeExperimentVideoStarted&&typeExperimentVideo.video.readyState>=2){typeExperimentVideo.context.drawImage(typeExperimentVideo.video,0,0,typeExperimentVideo.canvas.width,typeExperimentVideo.canvas.height);typeExperimentVideo.texture.needsUpdate=true}
      const visibleVideoProjects=new Set();
      for(const card of cards)if(card.visible&&Math.abs(card.position.y)<2.2&&card.material.uniforms.uOpacity.value>.01)visibleVideoProjects.add(card.userData.projectIndex);
      for(const surface of liveVideoSurfaces){const wanted=!videosPaused&&visibleVideoProjects.has(surface.projectIndex);surface.wanted=wanted;if(wanted){ensureVideoSurface(surface);if(surface.ready&&surface.video.paused)surface.video.play().catch(()=>{});if(surface.ready&&surface.video.readyState>=2){drawCenteredVideo(surface);surface.texture.needsUpdate=true}}else if(!surface.video.paused)surface.video.pause()}
      postMat.uniforms.uProjectMode.value=0;
      postMat.uniforms.uReveal.value=introDone?1:reveal;
      postMat.uniforms.uTime.value=now*.001;

      raycaster.setFromCamera(pointer,camera);const hits=raycaster.intersectObjects(cards.filter(c=>c!==selected));hovered=introDone?(hits[0]?.object||null):null;
      setCursor(selected?'close':(hovered&&!dragging?'view':''));
      const speed=Math.min(Math.abs(velocity)/.04,1);
      /* Keep image content anchored to the cursor. Only actual grid scrolling
         contributes a subtle vertical texture offset. */
      parallaxTarget.set(0,morphEnabled?THREE.MathUtils.clamp(-velocity*15.5,-.125,.125)*effectStrength:0);texParallax.lerp(parallaxTarget,1-Math.exp(-dt*4));
      if(selected){
        if(!closing){selection=Math.min(1,selection+dt/.9);const t=1-Math.pow(1-selection,3);selected.position.lerpVectors(selected.userData.fromPos,new THREE.Vector3(0,0,.15),t);const target=Math.min(2.35,innerWidth/innerHeight*2);selected.scale.lerpVectors(selected.userData.fromScale,new THREE.Vector3(target,target,1),t);selected.material.uniforms.uSelectProgress.value=t;selected.material.uniforms.uScaleDelay.value+=(t-selected.material.uniforms.uScaleDelay.value)*(1-Math.exp(-dt*5.5));selected.material.uniforms.uDispAmount.value=Math.sin(t*Math.PI)*.95}
        else{selection=Math.max(0,selection-dt/.7);const t=1-Math.pow(1-selection,3);selected.position.lerpVectors(selected.userData.fromPos,new THREE.Vector3(0,0,.15),t);const target=Math.min(2.35,innerWidth/innerHeight*2);selected.scale.lerpVectors(selected.userData.fromScale,new THREE.Vector3(target,target,1),t);selected.material.uniforms.uSelectProgress.value=t;selected.material.uniforms.uScaleDelay.value=t;selected.material.uniforms.uDispAmount.value=Math.sin(t*Math.PI)*.95;if(selection<=0){selected.material.uniforms.uSelectProgress.value=selected.material.uniforms.uScaleDelay.value=selected.material.uniforms.uDispAmount.value=0;selected.renderOrder=0;selected=null;closing=false;document.body.classList.remove('open');layout()}}
      }
      trailHover+=((morphEnabled&&((hovered&&!dragging&&pointerMoved)||selected)?1:0)-trailHover)*.12;trailMat.uniforms.uHover.value=morphEnabled?trailHover*(pointerMoved?1:0):0;trailMat.uniforms.uPrev.value=trailA.texture;renderer.setRenderTarget(trailB);renderer.render(trailScene,ortho);[trailA,trailB]=[trailB,trailA];pointerMoved=false;
      renderer.setRenderTarget(sceneTarget);renderer.setClearColor(0xffffff,1);renderer.clear();renderer.render(scene,camera);
      postMat.uniforms.uScene.value=sceneTarget.texture;postMat.uniforms.uTrailMap.value=trailA.texture;postMat.uniforms.uRgbAmount.value=morphEnabled?.12*effectStrength:0;postMat.uniforms.uBlur.value=morphEnabled?.045*effectStrength:0;const fishTarget=morphEnabled?THREE.MathUtils.lerp(-1.12,-1.5,speed)*effectStrength:0;postMat.uniforms.uFisheye.value+=(fishTarget-postMat.uniforms.uFisheye.value)*.08;renderer.setClearColor(0x000000,0);renderer.setRenderTarget(null);renderer.render(postScene,ortho);
    }
    layout();animate();sceneReady=true;
  </script>
